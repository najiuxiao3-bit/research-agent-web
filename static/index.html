<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资料查询总结助手</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" aria-hidden="true">🔍</div>
      <div>
        <h1>资料查询总结助手</h1>
        <p>输入问题 → 联网检索 → 提炼带来源的中文摘要</p>
      </div>
      <span class="badge">Agent · FastAPI</span>
    </div>
  </header>

  <div class="container">
    <div class="layout">
      <aside class="card history">
        <h2>历史记录</h2>
        <ul id="history-list"><li class="empty">加载中…</li></ul>
      </aside>

      <section class="card composer">
        <form id="ask-form">
          <textarea id="query" placeholder="例如：2025 年大模型开源生态有哪些代表性进展？" maxlength="1000"></textarea>
          <div class="actions">
            <button type="submit" id="submit-btn" class="btn">开始调研</button>
            <span id="status"></span>
          </div>
        </form>

        <div id="result" hidden>
          <div class="answer-card" id="answer"></div>
          <div class="sources" id="sources"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
